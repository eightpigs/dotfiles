#--------------------------------------------------------------------------
# plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'


# https://github.com/schasse/tmux-jump
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 's'




#--------------------------------------------------------------------------
# notes
# bind-key == bind
# unbind-key == unbind
# bind -r: repeatable
# bind -n: no prefix
#--------------------------------------------------------------------------
# key bindings
set-option -g prefix M-b

# Resolve a standalone Escape immediately. Ghostty writes a real Meta/function
# key sequence as one batch, so zero keeps Alt bindings working while ensuring
# a quickly-following h/j/k/l cannot be folded into M-h/M-j/M-k/M-l.
set -sg escape-time 0

# Never mistake a fast burst of real keypresses for a paste. Bracketed paste
# remains available and is unambiguous in Ghostty/kitty.
set -g assume-paste-time 0

# vi keys in copy mode
set-window-option -g mode-keys vi

# vi-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# grow left
bind -r H resize-pane -L 10
# grow right
bind -r L resize-pane -R 10
# grow up
bind -r K resize-pane -U 5
# grow down
bind -r J resize-pane -D 5

# last window
bind-key ` last-window

bind Escape copy-mode

unbind p
bind p pasteb

set -g copy-command "pbcopy"
bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind y key in copy mode to select and copy to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel


# bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'yank > #{pane_tty}'

# https://robots.thoughtbot.com/how-to-copy-and-paste-with-tmux-on-mac-os-x
# MacOS: brew install reattach-to-user-namespace
# if-shell "uname | grep -q Darwin" "bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'"

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# keep layout, equalize pane sizes
bind = select-layout -E

# prefix + Alt+1..7 layouts (do not override in mirror-prefix-meta)
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled
bind M-6 select-layout main-horizontal-mirrored
bind M-7 select-layout main-vertical-mirrored

# new windows inherit the current pane cwd
bind c new-window -c "#{pane_current_path}"

# after a manual rename, prefer #W in the status format
bind-key , command-prompt -I "#W" "rename-window -- '%%'; set-option -w @name-set 1"

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# toggle or move the status bar
bind-key -n S-Up if-shell -F '#{==:#{status-position},top}' 'set-option -g status' 'set-option -g status-position top ; set-option -g status on'
bind-key -n S-Down if-shell -F '#{==:#{status-position},bottom}' 'set-option -g status' 'set-option -g status-position bottom ; set-option -g status on'
bind-key -n S-Left previous-window
bind-key -n S-Right next-window
# Ghostty/kitty already normalize Shift+Enter to LF. Keeping a tmux mapping as
# well can re-encode that LF as visible CSI-u in an extended-key pane.
unbind-key -n S-Enter

# insert this window before the given index and renumber
bind . command-prompt -p "insert before index:" { move-window -b -t "%%" ; move-window -r }

# swap with neighbor and keep focus
# from: https://github.com/justinmk/config/blob/master/.tmux.conf
bind-key -n M-Left  swap-window -d -t -1
bind-key -n M-Right swap-window -d -t +1

bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

bind-key -n M-h if -F '#{m/r:[vV][iI][mM],#{pane_current_command}}' 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if -F '#{m/r:[vV][iI][mM],#{pane_current_command}}' 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if -F '#{m/r:[vV][iI][mM],#{pane_current_command}}' 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if -F '#{m/r:[vV][iI][mM],#{pane_current_command}}' 'send-keys M-l' 'select-pane -R'

#--------------------------------------------------------------------------
# basics

# disable automatic rename
set -wg allow-rename off
set -wg automatic-rename off

# mouse
set -g mouse on

# do not switch windows by scrolling the status bar
unbind-key -n WheelUpStatus
unbind-key -n WheelDownStatus

# scroll 2 lines per wheel event in copy mode (tmux default is 5)
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# login shell
set-option -g default-shell /bin/zsh

# Use "tmux-256color" if available, to enable more capabilities.
if-shell 'infocmp tmux-256color' 'set -g default-terminal "tmux-256color"' 'set -g default-terminal "screen-256color"'

#--------------------------------------------------------------------------
# terminal-features (tmux 3.2+); prefer this over terminal-overrides
# RGB:truecolor  usstyle:undercurl  sync:synchronized output
# hyperlinks:OSC 8  focus:focus events  strikethrough/overline:SGR
# fixed indices so source-file does not append duplicates
set -s terminal-features[100] '*:RGB:usstyle:sync:hyperlinks:focus:strikethrough:overline'

# Prefer stable legacy key bytes over CSI-u. In particular, `always` can turn
# LF/C-j into ESC[106;5u; if a nested program does not share tmux's protocol
# state, that sequence is inserted literally as ^[[106;5u.
set -s extended-keys off
# Clear the old extkeys array entry when this file is re-sourced in a running
# server; on a fresh server this is simply a no-op.
set -su terminal-features[101]

# allow graphics protocols through tmux (image.nvim, yazi, icat)
set -g allow-passthrough on


# Ms modifies OSC 52 clipboard handling to work with mosh, see
# https://gist.github.com/yudai/95b20e3da66df1b066531997f982b57b
# fixed indices so this file can be re-sourced
set -s terminal-overrides[100] "vte*:XT:Ms=\\E]52;c;%p2%s\\7"
set -s terminal-overrides[101] "xterm*:XT:Ms=\\E]52;c;%p2%s\\7:RGB"

# enable OSC 52 clipboard
# https://medium.freecodecamp.org/tmux-in-practice-integration-with-system-clipboard-bcd72c62ff7b
set -g set-clipboard on

set -g focus-events on

set -g set-titles on
# set-option -g set-titles-string '#{pane_current_path} | #{pane_title}'
set-option -g set-titles-string '#{pane_title}'

# refresh window names via #(); 5s balances cost and freshness
set -g status-interval 5
set -g renumber-windows on
# large scrollback for tmux-resurrect
set -g history-limit 50000
set -g base-index 1
set -g message-style fg=white,bg=black,bright

set -g status-position bottom

set -g status-left " "
# right status: actionable flags only; hide numeric session names
# tmux cannot tell Kitty fullscreen from a large window, so do not infer a clock from size
set -g status-right '#{?synchronize-panes,#[fg=red#,bold] SYNC#[default],}#{?window_zoomed_flag,#[fg=yellow#,bold] ZOOM#[default],}#{?pane_in_mode,#[fg=cyan#,bold] COPY#[default],}#{?#{m/r:^[0-9]+$,#{session_name}},, #[dim]#{session_name}#[default]} '
set -g status-justify left
set -g status-style bg=default

# show full command line for whitelisted foreground programs
set -g @status-command-whitelist 'ssh mosh'

setw -g window-status-style bg=default
# if @name-set=1 show the manual name; else a dynamic label
setw -g window-status-format ' #I:#{?@name-set,#W,#(~/.config/tmux/pane-status-label #{q:pane_tty} #{q:pane_current_path} #{q:HOME} #{q:pane_current_command} #{q:@status-command-whitelist})} '

setw -g window-status-current-style fg=red,bg=default,bold
setw -g window-status-current-format ' #I:#{?@name-set,#W,#(~/.config/tmux/pane-status-label #{q:pane_tty} #{q:pane_current_path} #{q:HOME} #{q:pane_current_command} #{q:@status-command-whitelist})} '

set -g pane-border-style bg=default,fg=green
set -g pane-active-border-style fg=red,bg=default

set -g cursor-style bar

run '~/.tmux/plugins/tpm/tpm'
# Option-as-prefix often sends Meta on the next key; mirror M-<key> onto prefix binds
run-shell '~/.config/tmux/mirror-prefix-meta'
