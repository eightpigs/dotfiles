# aria2 defaults. Do not put download paths or RPC secrets here.

continue=true
max-connection-per-server=5
min-split-size=10M
split=6
timeout=60

# RPC on loopback only. Set rpc-secret in a local config if you enable this.
enable-rpc=true
rpc-listen-all=false
rpc-allow-origin-all=false

# BitTorrent
listen-port=51413
enable-dht=true
enable-peer-exchange=true
seed-ratio=1.0
bt-save-metadata=true
