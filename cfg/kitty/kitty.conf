# Fonts
# -----------------------------------------------------------------------------
# font_family       IBM Plex Mono
# bold_font         IBM Plex Mono SemiBold
# italic_font       IBM Plex Mono Italic
# bold_italic_font  IBM Plex Mono SemiBold Italic

font_family       Monaspace Xenon Light
bold_font         Monaspace Xenon Medium
italic_font       Monaspace Xenon Italic
bold_italic_font  Monaspace Xenon SemiBold Italic

font_size 14.0
disable_ligatures never

modify_font cell_height 10px
modify_font baseline 0

# https://sw.kovidgoyal.net/kitty/faq/#kitty-is-not-able-to-use-my-favorite-font
# https://github.com/ryanoasis/nerd-fonts/releases
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+FF00-U+FFEF LXGW WenKai


# Cursor
# -----------------------------------------------------------------------------
# block, beam, underline
cursor_shape beam
cursor_blink_interval 0



## Scrollback
# -----------------------------------------------------------------------------
scrollback_lines 9000
scrollback_pager_history_size 8
scrollbar never
scrollback_fill_enlarged_window yes



## Mouse
# -----------------------------------------------------------------------------
mouse_hide_wait 0.0
url_color #0366d6
url_style straight
open_url_with default
url_prefixes http https ftp mailto git
copy_on_select no
detect_urls yes



## Performance tuning
# -----------------------------------------------------------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes



## Terminal bell
# -----------------------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no
command_on_bell none



## Window layout
# -----------------------------------------------------------------------------
enabled_layouts tall,stack,splits
remember_window_size  yes
initial_window_width  840
initial_window_height 550
window_border_width 0.5pt
window_margin_width 0.0
# top/bottom 10, left/right 4
window_padding_width 10.0 4.0
# On macOS native fullscreen, drop vertical padding only; restore on exit.
watcher fullscreen_padding.py
placement_strategy center
# inactive_text_alpha 0.7
# hide_window_decorations no
hide_window_decorations titlebar-only
confirm_os_window_close -1



## Tab Bar
# -----------------------------------------------------------------------------
tab_bar_edge top
tab_bar_style custom
tab_bar_margin_width 0.0
active_tab_font_style normal
inactive_tab_font_style normal
tab_title_max_length 30
# previous, left, right
tab_switch_strategy previous



## Advanced
# -----------------------------------------------------------------------------
allow_remote_control socket-only
# listen_on tcp:localhost:12345
listen_on unix:/tmp/kitty.socket
clipboard_control write-clipboard


## OS specific tweaks
# -----------------------------------------------------------------------------
# macos_titlebar_color system # background, system
macos_hide_from_tasks no
macos_quit_when_last_window_closed yes
macos_window_resizable yes
# window, menubar, all
macos_show_window_title_in window
macos_menubar_title_max_length 0
macos_option_as_alt yes
macos_traditional_fullscreen no
macos_colorspace srgb
macos_thicken_font 0.60


## Color scheme
# -----------------------------------------------------------------------------
include themes/light.conf
# include themes/Base16 Google Light.conf
# include themes/Gruvbox Material Dark Medium.conf



## Key Bindings
# -----------------------------------------------------------------------------
# reload config: ctrl+shift+f5 (also ++, on macOS)


kitty_mod ctrl+shift

action_alias launch_cwd launch --cwd=current --copy-env

# launch applications
map ctrl+alt+1 launch_cwd nvim
map ctrl+alt+2 launch_cwd --hold git diff -p
map ctrl+alt+3 launch_cwd zsh -c 'source ~/.zshrc && fglog'
map ctrl+alt+0 launch_cwd ssh dev

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+. set_tab_title
map cmd+0 change_font_size all 0

map cmd+w close_window

# In tmux, split using the active pane directory; otherwise use Kitty's cwd.
map cmd+d kitten tmux_cwd_split.py vsplit
map cmd+shift+d kitten tmux_cwd_split.py hsplit

map kitty_mod+enter launch_cwd
map cmd+enter launch_cwd
map cmd+t launch --cwd=current --type=tab --location=after
map cmd+shift+enter toggle_layout stack
map shift+enter send_text all \x0a
